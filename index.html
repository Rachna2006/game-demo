<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1fb;--ink:#1e2250;--board:#1e2250;--grid:#272c63;--snake:#ffb703;--food:#ff4d6d;--btn:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--ink:#e8eaff;--board:#1b1f4a;--grid:#232860;--btn:#262b63}}
:root[data-theme="dark"]{--bg:#12142b;--ink:#e8eaff;--board:#1b1f4a;--grid:#232860;--btn:#262b63}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
h1{margin:0;font-size:2rem;font-weight:600}
.bar{width:100%;display:flex;justify-content:space-between;font-size:1.1rem}
.wrap{position:relative;width:100%}
canvas{width:100%;aspect-ratio:1;background:var(--board);border-radius:16px;display:block;touch-action:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;background:rgba(18,20,43,.6);border-radius:16px;cursor:pointer;padding:16px}
#msg b{font-size:1.6rem}
#msg.hide{display:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
.pad button{font:inherit;font-size:1.4rem;border:0;border-radius:14px;background:var(--btn);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(30,34,80,.25)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad button:focus-visible,#msg:focus-visible{outline:3px solid var(--food);outline-offset:2px}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
p{margin:0;font-size:.9rem;opacity:.7;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Snake</h1>
  <div class="bar"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <div class="wrap">
    <canvas id="c" width="400" height="400"></canvas>
    <div id="msg" tabindex="0" role="button"><b>Ready?</b><span>Tap or press Space to start</span></div>
  </div>
  <div class="pad">
    <button id="up" aria-label="Up">▲</button>
    <button id="left" aria-label="Left">◀</button>
    <button id="down" aria-label="Down">▼</button>
    <button id="right" aria-label="Right">▶</button>
  </div>
  <p>Arrow keys or WASD to steer. Swipe on the board. Space pauses.</p>
</main>
<script>
const N=20,S=20,cv=document.getElementById("c"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id),msg=$("msg");
let snake,dir,next,food,score,best=0,timer=null,state="idle";
try{best=+localStorage.getItem("snake-best")||0}catch(e){}
$("best").textContent=best;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next={x:1,y:0};score=0;
  $("score").textContent=0;placeFood();draw();
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function start(){
  if(state==="over"||state==="idle")reset();
  state="play";msg.classList.add("hide");
  clearInterval(timer);timer=setInterval(tick,115);
}
function pause(){
  state="pause";clearInterval(timer);
  msg.innerHTML="<b>Paused</b><span>Tap or press Space to resume</span>";msg.classList.remove("hide");
}
function over(){
  state="over";clearInterval(timer);
  if(score>best){best=score;$("best").textContent=best;try{localStorage.setItem("snake-best",best)}catch(e){}}
  msg.innerHTML="<b>Game over</b><span>You scored "+score+". Tap or press Space to play again</span>";
  msg.classList.remove("hide");
}
function tick(){
  dir=next;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))return over();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;$("score").textContent=score;placeFood()}else snake.pop();
  draw();
}
function draw(){
  ctx.clearRect(0,0,400,400);
  ctx.fillStyle=css("--grid");
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*S,y*S,S,S);
  ctx.fillStyle=css("--food");ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);ctx.fill();
  ctx.fillStyle=css("--snake");
  snake.forEach((s,i)=>{ctx.beginPath();ctx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,i?5:8);ctx.fill()});
  const h=snake[0];ctx.fillStyle="#1e2250";
  [[-3,-3],[3,-3]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(h.x*S+S/2+dx+dir.x*3,h.y*S+S/2+dy+dir.y*3,2,0,7);ctx.fill()});
}
function turn(x,y){
  if(state!=="play")return;
  if(x===-dir.x&&y===-dir.y)return;
  next={x,y};
}
const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault();state==="play"?pause():start();return}
  const k=keys[e.key]||keys[e.key.toLowerCase()];
  if(k){e.preventDefault();turn(...k)}
});
msg.addEventListener("click",start);
msg.addEventListener("keydown",e=>{if(e.key==="Enter")start()});
$("up").onclick=()=>turn(0,-1);$("down").onclick=()=>turn(0,1);
$("left").onclick=()=>turn(-1,0);$("right").onclick=()=>turn(1,0);
let t0;
cv.addEventListener("touchstart",e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener("touchend",e=>{
  if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1);
});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>snake&&draw());
reset();
</script>
</body>
</html>
